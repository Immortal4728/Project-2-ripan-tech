<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Ticket Booking System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="my-4">
      <h1 class="text-center">Admin Panel</h1>
    </header>

    <div>
      <h2>Manage Events</h2>
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addEventModal">Add Event</button>

      <table class="table mt-3">
        <thead>
          <tr>
            <th>Name</th>
            <th>Date</th>
            <th>Location</th>
            <th>Available Tickets</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="event-table">
          <!-- Dynamic events will populate here -->
        </tbody>
      </table>
    </div>

    <!-- Add Event Modal -->
    <div class="modal fade" id="addEventModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Event</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="text" id="event-name-input" class="form-control" placeholder="Event Name" />
            <input type="date" id="event-date-input" class="form-control mt-2" />
            <input type="text" id="event-location-input" class="form-control mt-2" placeholder="Location" />
            <input type="number" id="event-tickets-input" class="form-control mt-2" placeholder="Tickets Available" />
            <input type="number" id="event-price-input" class="form-control mt-2" placeholder="Price" />
            <button class="btn btn-primary mt-2" onclick="addEvent()">Add Event</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center mt-4">
      <p>&copy; 2025 Ticket Booking System</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
