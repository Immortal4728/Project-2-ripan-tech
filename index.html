<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket Booking System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="my-4">
      <h1 class="text-center">Event Ticket Booking</h1>
    </header>

    <div id="events-list" class="row">
      <!-- Event Cards will be dynamically populated -->
    </div>

    <div id="bookingModal" class="modal fade" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Book Tickets</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p id="event-name"></p>
            <label for="ticket-count">Tickets:</label>
            <input type="number" id="ticket-count" min="1" max="10" class="form-control mb-2" />
            <button class="btn btn-primary" onclick="bookTickets()">Confirm Booking</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center mt-4">
      <p>&copy; 2025 Ticket Booking System</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
